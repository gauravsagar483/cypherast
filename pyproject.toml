[project]
name = "cypherast"
version = "0.1.9"
description = "Cypher/GQL transpiler, rewriter, planner, and in-memory executor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Gaurav Sagar" }]
maintainers = [{ name = "Gaurav Sagar" }]
keywords = ["cypher", "gql", "graph", "parser", "transpiler", "opencypher"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/gauravsagar483/cypherast"
Repository = "https://github.com/gauravsagar483/cypherast"
Issues = "https://github.com/gauravsagar483/cypherast/issues"
"Release notes" = "https://github.com/gauravsagar483/cypherast/releases"

[project.scripts]
cypherast = "cypherast.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cypherast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["cypherast"]
omit = ["cypherast/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["cypherast"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "pre-commit>=4.0",
]
