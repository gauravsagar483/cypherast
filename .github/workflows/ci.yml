# CI — lint, types, tests + coverage

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check cypherast tests

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --group dev
      - name: Mypy (strict)
        run: uv run mypy cypherast

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync deps
        run: uv sync --group dev
      - name: Pytest + coverage
        run: >
          uv run pytest
          --cov=cypherast
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-fail-under=60
      - name: PuppyGraph dialect suite
        run: uv run pytest tests/test_puppygraph_dialect.py -q
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Coverage summary (PR)
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("coverage.xml")
          if not p.exists():
              print("coverage.xml missing")
              raise SystemExit(0)
          root = ET.parse(p).getroot()
          line_rate = float(root.attrib.get("line-rate", "0"))
          pct = round(line_rate * 100, 1)
          print(f"Line coverage: {pct}% (fail-under 60%)")
          PY
